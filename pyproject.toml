[project]
name = "icostport"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "XuCcc", email = "xuuupro@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
icostport = "icostport.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
